<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Confirmation</title>
</head>
<body>

<h3> Student Confirmation</h3>

The student is : <span th:text="${student.firstName} + ' ' + ${student.lastName}" />

<br> <br>
 From : <span th:text="${student.country}"/>

<br><br>
The student likes:<span th:text="${student.programmingLanguage}"/>
<br><br>

has worked with:
<ul>
    <li th:each="tempSystem : ${student.operatingSystem}"
        th:text="${tempSystem}"></li>
</ul>
</body>
</html>
